# Network Device Configuration
# Edit this file with your actual network device details

devices:
  - name: "Core Router"
    ip: "192.168.1.1"
    type: "router"
    commands:
      - "interface GigabitEthernet0/0"
      - "ip address 192.168.1.1 255.255.255.0"
      - "no shutdown"
  
  - name: "Access Switch"
    ip: "192.168.1.2"
    type: "switch"
    commands:
      - "vlan 10"
      - "name DATA"
      - "vlan 20"
      - "name VOICE"

monitoring:
  interval: 60  # seconds
  alert_threshold: 3  # number of failed checks before alert
  
logging:
  level: "INFO"
  directory: "logs"
```

